<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 196" width="442" height="196" role="img" aria-labelledby="t d">
  <title id="t">Komorebi 木漏れ日商店</title>
  <desc id="d">Scroll-driven storefront: fly down from the rooftops into a tiny Japanese corner shop and pick snacks. Built with HTML, CSS, Canvas, No libraries.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".8"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="1" cy="0" r=".9">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".14"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .tag { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #67e8f9; }
    .live { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #8b98a9; }
    .ttl { font: 600 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .dsc { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #8b98a9; }
    .stk { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 1.2px; fill: #c9d4e3; }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 368px 32px; }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: 0; transform: scale(2.6) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="442" height="196" rx="16" fill="#0b0f17"/>
  <rect width="442" height="196" rx="16" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="441" height="195" rx="15.5" fill="none" stroke="#94a3b8" stroke-opacity=".2"/>
  <rect x="22" y="0" width="398" height="1" fill="url(#top)"/>

  <text class="tag" x="24" y="36">CREATIVE FRONT END</text>
  <circle class="dot" cx="368" cy="32" r="3.5" fill="#34d399"/>
  <circle cx="368" cy="32" r="3" fill="#34d399"/>
  <text class="live" x="418" y="36" text-anchor="end">LIVE</text>
  <text class="ttl" x="24" y="78">Komorebi 木漏れ日商店</text>
  <text class="dsc" x="24" y="106">Scroll-driven storefront: fly down from the rooftops</text>
  <text class="dsc" x="24" y="126">into a tiny Japanese corner shop and pick snacks.</text>
  <rect x="24" y="150" width="394" height="1" fill="#94a3b8" fill-opacity=".16"/>
  <text class="stk" x="24" y="174">HTML  ·  CSS  ·  CANVAS  ·  NO LIBRARIES</text>
</svg>
