name: Build profile

# Rebuilds README.md and assets/ whenever the config (or the generator) changes.
on:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - build.mjs
      - src/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The template repo keeps its own README (the documentation), so it never
    # builds over it. Repos created from the template do.
    if: ${{ !github.event.repository.is_template && github.repository != 'rajithdev/profile-forge' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - name: Commit the rebuilt profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet || git commit -m "Rebuild profile"
          git push
